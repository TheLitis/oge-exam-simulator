name: Check and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: oge-exam-simulator-linux-x64
          path: dist/oge-exam-simulator-linux-x64.tar.gz
          if-no-files-found: error
